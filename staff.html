<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Salon Manager Staff</title>
<style>
:root{--bg:#f6f6f6;--card:#fff;--text:#111;--muted:#777;--blue:#0a84ff;--danger:#c33}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:560px;margin:auto;min-height:100dvh;padding:18px 14px 96px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:850;font-size:21px}.small{font-size:12px;color:#777}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi .l{font-size:11px;color:#777}.kpi .v{font-size:22px;font-weight:850;margin-top:5px}.wide{grid-column:1/-1}h2{font-size:18px;margin:22px 4px 10px}.item{background:#fff;border-radius:14px;padding:13px 14px;margin:8px 0}.item .t{font-weight:800}.item .s{font-size:12px;color:#666;line-height:1.55;margin-top:4px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:16px;margin:5px 0 10px}textarea{min-height:90px}button{border:0;background:#111;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:760}.ghost{background:#eee;color:#111}.soft{background:#fff;color:#111;border:1px solid #ddd}.blue{background:var(--blue)}.danger{background:#fff;color:var(--danger);border:1px solid #ecc}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.section{display:none}.section.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #e5e5e5;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{flex:1;background:transparent;color:#888;padding:6px 2px;font-size:11px}.nav button.active{color:#111}.ico{display:block;font-size:18px;margin-bottom:2px}.fab{position:fixed;right:18px;bottom:88px;width:54px;height:54px;border-radius:50%;font-size:24px;z-index:9}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;align-items:flex-end}.sheet{width:100%;max-width:560px;margin:auto;max-height:91dvh;overflow:auto;background:#f8f8f8;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1}.badge{display:inline-block;font-size:10px;padding:4px 7px;border-radius:99px;background:#eee;margin-left:5px}.empty{text-align:center;color:#999;font-size:13px;padding:25px 8px}.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}.login-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:22px}.login-card h1{font-size:24px;margin:0 0 8px}.login-card button{width:100%;margin-top:8px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.monthbar button{background:#fff;color:#111;border:1px solid #ddd;padding:8px 12px}.monthtitle{font-size:18px;font-weight:850}.trend{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:11px}.trend td,.trend th{padding:8px 6px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}.trend td:first-child,.trend th:first-child{text-align:left}.status{font-size:12px;color:#777;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="small">Salon Manager</div><h1>スタッフログイン</h1>
    <div class="small" style="margin-bottom:14px">管理者から発行されたユーザー名とパスワードを入力してください。</div>
    <label>ユーザー名</label><input id="loginUser" autocomplete="username" autocapitalize="none">
    <label>パスワード</label><input id="loginPass" type="password" autocomplete="current-password">
    <button onclick="login()">ログイン</button><div id="loginStatus" class="status"></div>
  </div>
</div>

<div id="mainView" class="app hidden">
  <div class="top"><div><div class="brand">Salon Manager</div><div id="staffLabel" class="small"></div></div><button class="ghost" onclick="logout()">ログアウト</button></div>

  <section id="home" class="section active">
    <div class="monthbar"><button onclick="changeMonth(-1)">‹</button><div id="homeMonth" class="monthtitle"></div><button onclick="changeMonth(1)">›</button></div>
    <div id="homeStats" class="grid"></div>
    <h2>この先の予約</h2><div id="upcoming"></div>
  </section>

  <section id="reservations" class="section">
    <div class="monthbar"><button onclick="changeMonth(-1)">‹</button><div id="resMonth" class="monthtitle"></div><button onclick="changeMonth(1)">›</button></div>
    <div id="bookingList"></div>
  </section>

  <section id="customers" class="section">
    <h2>顧客</h2><input id="customerSearch" placeholder="名前で検索" oninput="renderCustomers()"><div id="customerList"></div>
  </section>

  <section id="sales" class="section">
    <div class="monthbar"><button onclick="changeMonth(-1)">‹</button><div id="salesMonth" class="monthtitle"></div><button onclick="changeMonth(1)">›</button></div>
    <div id="salesStats" class="grid"></div><h2>3か月前〜今月</h2><div id="trendHost"></div>
  </section>
</div>

<button id="fab" class="fab hidden" onclick="bookingForm()">＋</button>
<nav id="nav" class="nav hidden">
  <button class="active" data-tab="home" onclick="go('home',this)"><span class="ico">⌂</span>ホーム</button>
  <button data-tab="reservations" onclick="go('reservations',this)"><span class="ico">◷</span>予約</button>
  <button data-tab="customers" onclick="go('customers',this)"><span class="ico">♙</span>顧客</button>
  <button data-tab="sales" onclick="go('sales',this)"><span class="ico">¥</span>売上</button>
</nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div>

<script>
const STAFF_API='https://salon-manager-kzgvsz7r97-star.vercel.app/api/staff';
const TOKEN_KEY='salonManagerStaffToken';
const pad=n=>String(n).padStart(2,'0');
const localISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=localISO();
const monthKey=s=>String(s||'').slice(0,7);
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s||'').normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s・･]/g,'').toLowerCase();
let token=localStorage.getItem(TOKEN_KEY)||'',state={profile:null,bookings:[],customers:[]},viewMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),busy=false;
const $=id=>document.getElementById(id);
function monthString(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function monthLabel(d){return `${d.getFullYear()}年${d.getMonth()+1}月`}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1)}
function bookingStatus(b){return b.status||'booked'}
function isActive(b){return !['cancelled','noshow'].includes(bookingStatus(b))}
function isVisited(b){return bookingStatus(b)==='visited'||(bookingStatus(b)==='booked'&&b.date<todayISO&&b.paymentComplete)}
function hasLater(name,date){const n=normalize(name);return state.bookings.some(b=>normalize(b.customer)===n&&b.date>date&&isActive(b))}
function nextTaken(b){return !!b.nextBookingTaken||hasLater(b.customer,b.date)}
function modal(h){$('sheet').innerHTML=h;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
function go(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');$('fab').classList.toggle('hidden',id!=='reservations');renderAll()}
function statusLabel(b){return bookingStatus(b)==='visited'?'来店済み':bookingStatus(b)==='cancelled'?'キャンセル':bookingStatus(b)==='noshow'?'無断キャンセル':'予約中'}
function bookingType(v){return v==='designated'?'指名':v==='free'?'フリー':'未設定'}
async function api(path='',options={}){const r=await fetch(STAFF_API,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...options.headers}});const body=await r.json().catch(()=>({}));if(r.status===401){logout(false);throw new Error(body.error||'ログインし直してください');}if(!r.ok)throw new Error(body.error||'通信エラー');return body}
async function login(){const u=$('loginUser').value.trim(),p=$('loginPass').value;$('loginStatus').textContent='ログイン中…';try{const r=await fetch(STAFF_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:u,password:p})});const b=await r.json();if(!r.ok)throw new Error(b.error||'ログインできません');token=b.token;localStorage.setItem(TOKEN_KEY,token);await loadData();showMain();}catch(e){$('loginStatus').textContent=e.message}}
function logout(show=true){token='';localStorage.removeItem(TOKEN_KEY);$('mainView').classList.add('hidden');$('nav').classList.add('hidden');$('fab').classList.add('hidden');$('loginView').classList.remove('hidden');if(show)$('loginStatus').textContent='ログアウトしました'}
async function loadData(){if(!token)return;const b=await api('');state={profile:b.profile,bookings:b.bookings||[],customers:b.customers||[]};renderAll()}
function showMain(){$('loginView').classList.add('hidden');$('mainView').classList.remove('hidden');$('nav').classList.remove('hidden');$('fab').classList.remove('hidden');$('staffLabel').textContent=(state.profile?.name||'スタッフ')+' ・ '+((state.profile?.sources||[]).join(' / '));renderAll()}
function changeMonth(n){viewMonth=addMonths(viewMonth,n);renderAll()}
function monthBookings(m){return state.bookings.filter(b=>monthKey(b.date)===m)}
function statsFor(m){const all=monthBookings(m),visits=all.filter(isVisited),active=all.filter(isActive),newV=visits.filter(b=>b.newGuest),rep=visits.filter(b=>!b.newGuest),paid=all.filter(b=>b.paymentComplete&&isActive(b)),sales=paid.reduce((a,b)=>a+Number(b.price||0),0),forecast=active.reduce((a,b)=>a+Number(b.price||0),0),avg=visits.length?Math.round(sales/visits.length):0,newNext=newV.filter(nextTaken).length,repNext=rep.filter(nextTaken).length,uniqueNew=[...new Map(newV.map(b=>[normalize(b.customer),b])).values()].filter(b=>normalize(b.customer)),returned=uniqueNew.filter(f=>state.bookings.some(b=>normalize(b.customer)===normalize(f.customer)&&b.date>f.date&&isVisited(b))).length;return{all,visits,active,newV,rep,sales,forecast,avg,newNext,repNext,newNextRate:newV.length?Math.round(newNext/newV.length*100):0,repNextRate:rep.length?Math.round(repNext/rep.length*100):0,repeatRate:uniqueNew.length?Math.round(returned/uniqueNew.length*100):0,free:visits.filter(b=>b.bookingType==='free').length,designated:visits.filter(b=>b.bookingType==='designated').length}}
function renderAll(){if(!state.profile)return;const m=monthString(viewMonth);$('homeMonth').textContent=$('resMonth').textContent=$('salesMonth').textContent=monthLabel(viewMonth);const s=statsFor(m);$('homeStats').innerHTML=`<div class="card kpi"><div class="l">確定売上</div><div class="v">${yen(s.sales)}</div></div><div class="card kpi"><div class="l">見込み</div><div class="v">${yen(s.forecast)}</div></div><div class="card kpi"><div class="l">新規</div><div class="v">${s.newV.length}人</div></div><div class="card kpi"><div class="l">再来</div><div class="v">${s.rep.length}人</div></div><div class="card kpi"><div class="l">フリー / 指名</div><div class="v">${s.free} / ${s.designated}</div></div><div class="card kpi"><div class="l">平均単価</div><div class="v">${yen(s.avg)}</div></div>`;renderUpcoming();renderBookings();renderCustomers();renderSales()}
function renderUpcoming(){const a=state.bookings.filter(b=>b.date>=todayISO&&isActive(b)).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)).slice(0,8);$('upcoming').innerHTML=a.length?a.map(bookingCard).join(''):'<div class="empty">この先の予約はありません</div>'}
function bookingCard(b){return `<div class="item" onclick="bookingForm('${b.id}')"><div class="t">${esc(b.date)} ${esc(b.time)} ${esc(b.customer)} <span class="badge">${esc(statusLabel(b))}</span></div><div class="s">${esc(b.menu||'メニュー未入力')} ・ ${yen(b.price)} ・ ${esc(b.source||'')} ・ ${bookingType(b.bookingType)} ・ ${b.newGuest?'新規':'再来'}${b.paymentComplete?' ・ 決済済み':''}</div></div>`}
function renderBookings(){const m=monthString(viewMonth),a=state.bookings.filter(b=>monthKey(b.date)===m).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));$('bookingList').innerHTML=a.length?a.map(bookingCard).join(''):'<div class="empty">予約はありません</div>'}
function customerBookings(name){const n=normalize(name);return state.bookings.filter(b=>normalize(b.customer)===n).sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time))}
function renderCustomers(){const q=($('customerSearch')?.value||'').toLowerCase(),a=state.customers.filter(c=>(c.name||'').toLowerCase().includes(q));$('customerList').innerHTML=a.length?a.map(c=>{const h=customerBookings(c.name),v=h.filter(isVisited);return `<div class="item" onclick="openCustomer('${c.id}')"><div class="t">${esc(c.name)}</div><div class="s">来店 ${v.length}回${c.lastVisit?' ・ 最終 '+esc(c.lastVisit):''}</div></div>`}).join(''):'<div class="empty">顧客はまだいません</div>'}
function renderSales(){const m=monthString(viewMonth),s=statsFor(m);$('salesStats').innerHTML=`<div class="card kpi"><div class="l">確定売上</div><div class="v">${yen(s.sales)}</div></div><div class="card kpi"><div class="l">平均単価</div><div class="v">${yen(s.avg)}</div></div><div class="card kpi"><div class="l">新規 次回予約率</div><div class="v">${s.newNextRate}%</div></div><div class="card kpi"><div class="l">再来 次回予約率</div><div class="v">${s.repNextRate}%</div></div><div class="card wide kpi"><div class="l">リピート率</div><div class="v">${s.repeatRate}%</div></div>`;const months=[];for(let i=3;i>=0;i--){const d=addMonths(viewMonth,-i),mm=monthString(d),x=statsFor(mm);months.push(`<tr><td>${d.getMonth()+1}月</td><td>${x.newV.length}</td><td>${x.repeatRate}%</td><td>${x.newNextRate}%</td><td>${x.repNextRate}%</td></tr>`)}$('trendHost').innerHTML=`<table class="trend"><thead><tr><th>月</th><th>新規</th><th>リピート</th><th>新規次回</th><th>再来次回</th></tr></thead><tbody>${months.join('')}</tbody></table>`}
function bookingForm(id=''){const b=id?state.bookings.find(x=>x.id===id)||{}:{};const sources=state.profile?.sources||['その他'];modal(`<h3>${id?'予約を編集':'予約を追加'}</h3><label>日付</label><input id="fDate" type="date" value="${esc(b.date||todayISO)}"><div class="row"><div><label>開始</label><input id="fTime" type="time" value="${esc(b.time||'11:00')}"></div><div><label>終了</label><input id="fEnd" type="time" value="${esc(b.end||'13:00')}"></div></div><label>予約名</label><input id="fCustomer" value="${esc(b.customer||'')}"><label>メニュー</label><input id="fMenu" value="${esc(b.menu||'カット+カラー')}"><label>料金</label><input id="fPrice" type="number" value="${Number(b.price||0)}"><label>フリー / 指名</label><select id="fType"><option value="free" ${b.bookingType==='free'||!b.bookingType?'selected':''}>フリー</option><option value="designated" ${b.bookingType==='designated'?'selected':''}>指名</option></select><label>予約媒体</label><select id="fSource">${sources.map(x=>`<option ${b.source===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label>新規 / 再来</label><select id="fNew"><option value="new" ${b.newGuest?'selected':''}>新規</option><option value="repeat" ${b.newGuest===false?'selected':''}>再来</option></select><label>来店ステータス</label><select id="fStatus"><option value="booked" ${bookingStatus(b)==='booked'?'selected':''}>予約中</option><option value="visited" ${bookingStatus(b)==='visited'?'selected':''}>来店済み</option><option value="cancelled" ${bookingStatus(b)==='cancelled'?'selected':''}>キャンセル</option><option value="noshow" ${bookingStatus(b)==='noshow'?'selected':''}>無断キャンセル</option></select><label><input id="fNext" type="checkbox" style="width:auto" ${b.nextBookingTaken?'checked':''}> 次回予約あり</label><label><input id="fPaid" type="checkbox" style="width:auto" ${b.paymentComplete?'checked':''}> 決済完了</label><label>薬剤 / 配合</label><textarea id="fFormula">${esc(b.formula||'')}</textarea><label>施術メモ</label><textarea id="fVisitNote">${esc(b.visitNote||'')}</textarea><div class="actions"><button class="ghost" onclick="closeModal()">閉じる</button><button onclick="saveBooking('${id}')">保存</button></div>${id?`<button class="danger" style="width:100%;margin-top:8px" onclick="deleteBooking('${id}')">削除</button>`:''}`)}
async function saveBooking(id){const b={id:id||'',date:$('fDate').value,time:$('fTime').value,end:$('fEnd').value,customer:$('fCustomer').value.trim(),menu:$('fMenu').value.trim(),price:Number($('fPrice').value)||0,bookingType:$('fType').value,source:$('fSource').value,newGuest:$('fNew').value==='new',status:$('fStatus').value,nextBookingTaken:$('fNext').checked,paymentComplete:$('fPaid').checked,formula:$('fFormula').value,visitNote:$('fVisitNote').value};try{const r=await api('',{method:'POST',body:JSON.stringify({action:'upsertBooking',booking:b})});state={...state,bookings:r.bookings||[],customers:r.customers||[],profile:r.profile};closeModal();renderAll()}catch(e){alert(e.message)}}
async function deleteBooking(id){if(!confirm('この予約を削除しますか？'))return;try{const r=await api('',{method:'POST',body:JSON.stringify({action:'deleteBooking',id})});state={...state,bookings:r.bookings||[],customers:r.customers||[],profile:r.profile};closeModal();renderAll()}catch(e){alert(e.message)}}
function openCustomer(id){const c=state.customers.find(x=>x.id===id);if(!c)return;const h=customerBookings(c.name);modal(`<h3>${esc(c.name)}</h3><div class="small">このスタッフの来店・予約のみ表示</div><label>読み仮名</label><input id="cKana" value="${esc(c.kana||'')}"><label>Instagram</label><input id="cInstagram" value="${esc(c.instagram||'')}"><label>メモ</label><textarea id="cNote">${esc(c.note||'')}</textarea><button class="blue" style="width:100%" onclick="saveCustomer('${id}')">顧客メモを保存</button><h2>履歴</h2>${h.length?h.map(bookingCard).join(''):'<div class="empty">履歴なし</div>'}`)}
async function saveCustomer(id){const c={id,note:$('cNote').value,kana:$('cKana').value,instagram:$('cInstagram').value};try{const r=await api('',{method:'POST',body:JSON.stringify({action:'updateCustomer',customer:c})});state={...state,bookings:r.bookings||[],customers:r.customers||[],profile:r.profile};closeModal();renderAll()}catch(e){alert(e.message)}}
if(token){loadData().then(()=>showMain()).catch(()=>logout(false))}
setInterval(()=>{if(token&&!document.hidden&&!busy)loadData().catch(()=>{})},30000);
document.addEventListener('visibilitychange',()=>{if(token&&!document.hidden)loadData().catch(()=>{})});
</script>
</body>
</html>
