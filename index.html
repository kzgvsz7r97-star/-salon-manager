<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salon Manager</title></head><body><div style="font-family:-apple-system;padding:24px">Salon Managerを読み込み中…</div><script>(async()=>{try{const r=await fetch("https://raw.githubusercontent.com/kzgvsz7r97-star/-salon-manager/9dc7664a3fd688aa2d5074c1ca31a2f638d38265/index.html");if(!r.ok)throw new Error('base '+r.status);let h=await r.text();let p="<script>\nfunction _ocrWords(data){if(data.words&&data.words.length)return data.words;const out=[];(data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>(l.words||[]).forEach(w=>{if(w.text&&w.bbox)out.push(w)}))));return out}\nfunction _p(w){const b=w.bbox||{};return{text:String(w.text||'').trim(),x0:b.x0||0,x1:b.x1||0,y0:b.y0||0,y1:b.y1||0,cx:((b.x0||0)+(b.x1||0))/2,cy:((b.y0||0)+(b.y1||0))/2}}\nfunction _noise(t){t=String(t||'').trim();if(!t)return true;if(/決済|完了|売上|見込|新規|既存/.test(t))return true;if(/^[¥￥]?[\\d,:：.\\/\\-]+$/.test(t))return true;return false}\nfunction _minutesFromY(y,b){const rate=(y-b.gridT)/(b.gridB-b.gridT);return Math.round((420+rate*1020)/30)*30}\nfunction _timeFromY(y,b){let m=_minutesFromY(y,b);m=Math.max(0,Math.min(1440,m));if(m===1440)return'24:00';return`${pad(Math.floor(m/60))}:${pad(m%60)}`}\nfunction _nameLines(words,b){const ws=words.map(_p).filter(w=>w.cx>b.x0+2&&w.cx<b.x1-2&&w.cy>b.y0-6&&w.cy<b.y1+6&&!_noise(w.text)).sort((a,z)=>a.cy-z.cy||a.x0-z.x0),lines=[];ws.forEach(w=>{let line=lines.find(l=>Math.abs(l.cy-w.cy)<18);if(!line){line={cy:w.cy,words:[]};lines.push(line)}line.words.push(w);line.cy=line.words.reduce((s,x)=>s+x.cy,0)/line.words.length});return lines.sort((a,z)=>a.cy-z.cy).map(l=>{l.words.sort((a,z)=>a.x0-z.x0);return{cy:l.cy,text:l.words.map(w=>w.text).join(' ').replace(/\\s+/g,' ').replace(/[®©™]/g,'').trim()}}).filter(x=>x.text&&/[ぁ-んァ-ヶ一-龠A-Za-z]/.test(x.text))}\nfunction _groups(words,b){const lines=_nameLines(words,b),hourPx=(b.gridB-b.gridT)/17,groups=[];lines.forEach(line=>{const last=groups[groups.length-1];if(last&&line.cy-last.lastCy<hourPx*.8&&/^[ぁ-んァ-ヶ一-龠A-Za-zー\\s]{1,12}$/.test(line.text)){last.lines.push(line);last.lastCy=line.cy}else groups.push({lines:[line],firstCy:line.cy,lastCy:line.cy})});return groups.map(g=>{let name='';g.lines.forEach((l,i)=>{const compact=l.text.replace(/\\s/g,'');if(i===0)name=l.text;else if(compact.length<=3)name+=compact;else name+=' '+l.text});return{cy:g.firstCy,name:name.replace(/\\s+/g,' ').trim()}})}\nfunction _splitBlock(b,words){const gs=_groups(words,b);if(gs.length<=1)return[{...b,name:gs[0]?.name||''}];const result=[];let start=_minutesFromY(b.y0,b);gs.forEach((g,i)=>{let end;if(i<gs.length-1){end=Math.round((_minutesFromY(gs[i+1].cy,b)-15)/30)*30;if(end<=start)end=start+30}else end=_minutesFromY(b.y1,b);result.push({...b,y0:b.gridT+((start-420)/1020)*(b.gridB-b.gridT),y1:b.gridT+((end-420)/1020)*(b.gridB-b.gridT),name:g.name});start=end});return result}\nasync function analyzeShaireScreenshot(){const st=$('importStatus');st.innerHTML='画像を解析中… <strong>横＝日付、縦＝時間で分けています</strong>';try{const img=await loadImage(importImageDataURL),blocks=detectBookingBlocks(img);let ocr={data:{text:'',blocks:[],words:[]}};if(window.Tesseract)ocr=await Tesseract.recognize(importImageFile,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')st.textContent=`文字を読み取り中… ${Math.round((m.progress||0)*100)}%`}});const words=_ocrWords(ocr.data),weekStart=parseWeekStart(ocr.data.text)||guessWeekStartFromToday(),split=[];blocks.forEach(b=>_splitBlock(b,words).forEach(x=>split.push(x)));importDraft=split.map(b=>{const d=new Date(weekStart);d.setDate(weekStart.getDate()+b.col);const date=localISO(d);const paid=words.map(_p).some(w=>w.cx>b.x0&&w.cx<b.x1&&w.cy>b.y0-6&&w.cy<b.y1+6&&/決済|完了/.test(w.text));return{id:uid(),date,time:_timeFromY(b.y0,b),end:_timeFromY(b.y1,b),customer:b.name||'',menu:'',price:0,source:'SHAiRE',newGuest:inferNewGuest(b.name||'',date),paymentComplete:paid,conflict:false,mergeAction:'add'}}).filter(x=>x.customer);markImportConflicts();st.innerHTML=`解析完了：<strong>${importDraft.length}件</strong><br>日付列と時間軸ごとに分けました。`;renderImportResults();$('importActions').classList.remove('hidden')}catch(err){console.error(err);st.innerHTML='読み取りでエラーが出ました。予約を追加から手動入力できます。';importDraft=[];renderImportResults();$('importActions').classList.remove('hidden')}}\n<\\/script>";p=p.replace('<\\/script>','</scr'+'ipt>');h=h.replace('</body>',p+'</body>');document.open();document.write(h);document.close();}catch(e){document.body.innerHTML='<div style="font-family:-apple-system;padding:24px">読み込みエラー。ページを再読み込みしてください。<br><small>'+String(e)+'</small></div>';}})();</script></body></html>
