const frame=document.getElementById('app');
const status=document.getElementById('status');
const prepare=document.getElementById('prepare');
const after=document.getElementById('after');
let ready=false;

frame.addEventListener('load',()=>{
  try{
    const win=frame.contentWindow;
    if(typeof win.openImport!=='function'||typeof win.mergeImport!=='function'){
      throw new Error('Salon Managerの統合機能が見つかりません');
    }
    ready=true;
    prepare.disabled=false;
    status.textContent='準備OK。274件をSalon Managerへ直接渡せます。';
  }catch(err){
    status.textContent='エラー：'+(err.message||err);
  }
});

function injectHistory(){
  const win=frame.contentWindow;
  const doc=frame.contentDocument;
  win.openImport();

  const script=doc.createElement('script');
  script.textContent=`(()=>{
    importDraft=${JSON.stringify(HISTORY_DATA)};
    recalculateImportNewGuests();
    markImportConflicts();
    importDraft.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const add=importDraft.filter(x=>x.mergeAction==='add').length;
    const update=importDraft.filter(x=>x.mergeAction==='update').length;
    const skip=importDraft.filter(x=>x.mergeAction==='skip').length;
    window.__historyImportSummary={total:importDraft.length,add,update,skip};
    window.__mergeHistoryImport=()=>mergeImport();
    window.__reviewHistoryImport=()=>{
      renderImportResults();
      const a=document.getElementById('importActions');
      if(a)a.classList.remove('hidden');
      const st=document.getElementById('importStatus');
      if(st)st.innerHTML='直接データ化済み：<strong>'+importDraft.length+'件</strong>';
    };
  })();`;
  doc.body.appendChild(script);
  script.remove();
}

prepare.addEventListener('click',()=>{
  if(!ready)return;
  prepare.disabled=true;
  try{
    injectHistory();
    const sum=frame.contentWindow.__historyImportSummary;
    if(!sum)throw new Error('予約データの受け渡しに失敗しました');
    status.textContent=
      `読み込み完了：${sum.total}件\n`+
      `追加予定 ${sum.add}件 / 既存更新 ${sum.update}件 / 競合スキップ ${sum.skip}件`;
    prepare.style.display='none';
    after.style.display='block';
  }catch(err){
    console.error(err);
    status.textContent='エラー：'+(err.message||err);
    prepare.disabled=false;
  }
});

document.getElementById('merge').addEventListener('click',()=>{
  try{
    frame.contentWindow.__mergeHistoryImport();
    document.getElementById('overlay').style.display='none';
  }catch(err){
    status.textContent='統合エラー：'+(err.message||err);
  }
});

document.getElementById('review').addEventListener('click',()=>{
  try{
    frame.contentWindow.__reviewHistoryImport();
    document.getElementById('overlay').style.display='none';
  }catch(err){
    status.textContent='確認画面を開けませんでした：'+(err.message||err);
  }
});
</script>
