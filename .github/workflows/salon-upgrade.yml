name: 月初LINE編集機能アップデート

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add monthly LINE editor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # =========================
          # owner-upgrade.js
          # =========================
          path = Path("owner-upgrade.js")
          text = path.read_text()

          new_owner = r'''  async function loadMonthlyLinePreview(month) {
            const key = getCloudBackupKey();
            const status = $('monthlyLineStatus');
            const preview = $('monthlyLinePreview');

            month =
              Number(month) ||
              Number($('monthlyLineMonth')?.value) ||
              1;

            if (!key) {
              if (status) {
                status.textContent =
                  'クラウド同期キーが必要です';
              }
              return;
            }

            if (status) {
              status.textContent = '確認中…';
            }

            try {
              const r = await fetch(
                MONTHLY_LINE_API +
                  `?preview=1&month=${month}`,
                {
                  headers: {
                    'X-Backup-Key': key
                  }
                }
              );

              const body =
                await r.json().catch(() => ({}));

              if (!r.ok) {
                throw new Error(
                  body.error ||
                    '取得できませんでした'
                );
              }

              if (preview) {
                preview.value =
                  body.message || '';
              }

              if ($('monthlyLineEnabled')) {
                $('monthlyLineEnabled').checked =
                  body.enabled !== false;
              }

              const last = body.lastStatus;

              const templateText =
                body.custom
                  ? '編集した文面を使用中'
                  : '季節テンプレを使用中';

              if (status) {
                status.textContent =
                  last?.sentAt
                    ? `${templateText} ／ 前回：${new Date(
                        last.sentAt
                      ).toLocaleString('ja-JP')} ／ ${
                        last.ok
                          ? '送信受付済み'
                          : '送信失敗'
                      }`
                    : `${templateText} ／ まだ自動配信履歴はありません`;
              }
            } catch (e) {
              if (status) {
                status.textContent =
                  e.message;
              }
            }
          }

          window.changeMonthlyLineMonth =
            function () {
              loadMonthlyLinePreview(
                Number(
                  $('monthlyLineMonth')
                    ?.value
                )
              );
            };

          window.openMonthlyLineSettings =
            async function () {
              const now = new Date();

              const nextMonth =
                ((now.getMonth() + 1) % 12) +
                1;

              const enabled =
                db.monthlyLineSettings
                  ?.enabled !== false;

              const monthOptions =
                Array.from(
                  { length: 12 },
                  (_, i) => i + 1
                )
                  .map(
                    m => `
                      <option
                        value="${m}"
                        ${
                          m === nextMonth
                            ? 'selected'
                            : ''
                        }
                      >
                        ${m}月
                      </option>
                    `
                  )
                  .join('');

              modal(`
                <h3>月初LINE</h3>

                <div
                  class="note"
                  style="margin-bottom:10px"
                >
                  毎月1日10時ごろに、
                  女性・15〜29歳・友だち追加365日未満へ配信します。
                  <br>
                  文面は月ごとに編集できます。
                </div>

                <label>
                  <input
                    id="monthlyLineEnabled"
                    type="checkbox"
                    style="width:auto"
                    ${
                      enabled
                        ? 'checked'
                        : ''
                    }
                  >
                  月初LINEを自動配信する
                </label>

                <label>編集する月</label>

                <select
                  id="monthlyLineMonth"
                  onchange="changeMonthlyLineMonth()"
                >
                  ${monthOptions}
                </select>

                <label>配信文面</label>

                <textarea
                  id="monthlyLinePreview"
                  style="min-height:260px"
                >読み込み中…</textarea>

                <div
                  class="small"
                  style="margin-top:5px"
                >
                  この文章がそのまま配信されます。
                </div>

                <div
                  id="monthlyLineStatus"
                  class="small"
                  style="margin-top:8px"
                >
                  確認中…
                </div>

                <button
                  class="soft"
                  style="width:100%;margin-top:10px"
                  onclick="testMonthlyLine()"
                >
                  自分だけにテスト送信
                </button>

                <button
                  class="ghost"
                  style="width:100%;margin-top:8px"
                  onclick="resetMonthlyLineTemplate()"
                >
                  季節テンプレに戻す
                </button>

                <div class="actions">
                  <button
                    class="ghost"
                    onclick="closeModal()"
                  >
                    閉じる
                  </button>

                  <button
                    onclick="saveMonthlyLineSettings()"
                  >
                    文面を保存
                  </button>
                </div>
              `);

              await loadMonthlyLinePreview(
                nextMonth
              );
            };

          window.saveMonthlyLineSettings =
            async function () {
              const key =
                getCloudBackupKey();

              if (!key) return;

              const month =
                Number(
                  $('monthlyLineMonth')
                    ?.value
                );

              const message =
                String(
                  $('monthlyLinePreview')
                    ?.value || ''
                ).trim();

              const enabled =
                !!$('monthlyLineEnabled')
                  ?.checked;

              const status =
                $('monthlyLineStatus');

              if (!message) {
                return alert(
                  '配信文面を入力してください'
                );
              }

              if (message.length > 5000) {
                return alert(
                  '文面が長すぎます'
                );
              }

              if (status) {
                status.textContent =
                  '保存中…';
              }

              db.monthlyLineSettings ||= {};
              db.monthlyLineSettings.messages ||= {};

              db.monthlyLineSettings.enabled =
                enabled;

              db.monthlyLineSettings.messages[
                String(month)
              ] = message;

              logAudit(
                '月初LINE文面',
                `${month}月の文面を保存`
              );

              save();

              try {
                await postCloudSnapshot(
                  key,
                  db
                );

                writeSyncBase(db);
                cloudDirty = false;

                if (status) {
                  status.textContent =
                    `${month}月の文面を保存しました`;
                }
              } catch (e) {
                if (status) {
                  status.textContent =
                    '端末には保存しましたが、クラウド保存に失敗しました';
                }
              }
            };

          window.resetMonthlyLineTemplate =
            async function () {
              const key =
                getCloudBackupKey();

              if (!key) return;

              const month =
                Number(
                  $('monthlyLineMonth')
                    ?.value
                );

              if (
                !confirm(
                  `${month}月の文面を季節テンプレに戻しますか？`
                )
              ) {
                return;
              }

              db.monthlyLineSettings ||= {};
              db.monthlyLineSettings.messages ||= {};

              delete db.monthlyLineSettings
                .messages[String(month)];

              logAudit(
                '月初LINE文面',
                `${month}月をテンプレに戻しました`
              );

              save();

              try {
                await postCloudSnapshot(
                  key,
                  db
                );

                writeSyncBase(db);
                cloudDirty = false;

                await loadMonthlyLinePreview(
                  month
                );
              } catch (e) {
                const status =
                  $('monthlyLineStatus');

                if (status) {
                  status.textContent =
                    'テンプレへの復元保存に失敗しました';
                }
              }
            };

          window.testMonthlyLine =
            async function () {
              const key =
                getCloudBackupKey();

              if (!key) return;

              const month =
                Number(
                  $('monthlyLineMonth')
                    ?.value
                );

              const message =
                String(
                  $('monthlyLinePreview')
                    ?.value || ''
                ).trim();

              const status =
                $('monthlyLineStatus');

              if (!message) {
                return alert(
                  '配信文面を入力してください'
                );
              }

              if (status) {
                status.textContent =
                  'テスト送信中…';
              }

              try {
                const r =
                  await fetch(
                    MONTHLY_LINE_API,
                    {
                      method: 'POST',
                      headers: {
                        'Content-Type':
                          'application/json',
                        'X-Backup-Key':
                          key
                      },
                      body:
                        JSON.stringify({
                          action: 'test',
                          month,
                          message
                        })
                    }
                  );

                const body =
                  await r
                    .json()
                    .catch(() => ({}));

                if (!r.ok) {
                  throw new Error(
                    body.error ||
                      'テスト送信できませんでした'
                  );
                }

                if (status) {
                  status.textContent =
                    '自分のLINEへテスト送信しました';
                }

                logAudit(
                  '月初LINE',
                  `${month}月をテスト送信`
                );

                save();
              } catch (e) {
                if (status) {
                  status.textContent =
                    e.message;
                }
              }
            };

          '''

          pattern = re.compile(
              r"  async function loadMonthlyLinePreview\(\) \{.*?(?=^  function addUpgradeButtons\(\) \{)",
              re.S | re.M
          )

          text, count = pattern.subn(
              new_owner,
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "owner-upgrade.js の月初LINE部分が見つかりません"
              )

          path.write_text(text)

          # =========================
          # api/monthly-line.js
          # =========================
          path = Path("api/monthly-line.js")
          text = path.read_text()

          new_message = r'''function baseMessage(month) {
            const copy =
              MONTH_COPY[month];

            return `こんにちは！

          ${copy[0]}
          ${copy[1]}

          ご来店周期は1〜1.5ヶ月くらいが目安です◎

          ※次回予約をいただいている方にも一斉配信しています。
          ご予約の変更などは、分かり次第お早めにご連絡ください🙇‍♂️

          髪どうしようか迷っている方も、このLINEにそのまま気軽に相談してください☺️`;
          }

          function validMonth(value, fallback) {
            const month = Number(value);

            return (
              Number.isInteger(month) &&
              month >= 1 &&
              month <= 12
            )
              ? month
              : fallback;
          }

          function resolveMessage(
            state,
            month
          ) {
            const custom =
              state
                ?.monthlyLineSettings
                ?.messages
                ?.[String(month)];

            if (
              typeof custom === 'string' &&
              custom.trim()
            ) {
              return custom.trim();
            }

            return baseMessage(month);
          }

          '''

          pattern = re.compile(
              r"function makeMessage\(month\) \{.*?(?=^function retryKey\(year, month\) \{)",
              re.S | re.M
          )

          text, count = pattern.subn(
              new_message,
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "makeMessage が見つかりません"
              )

          start = text.find(
              "  const now =\n    jstNow();"
          )

          end_marker = (
              "  if (\n"
              "    req.method !== 'GET'\n"
              "  ) {"
          )

          end = text.find(
              end_marker,
              start
          )

          if start == -1 or end == -1:
              raise SystemExit(
                  "monthly-line handler が見つかりません"
              )

          new_handler = r'''  const now =
            jstNow();

          if (
            req.method === 'GET' &&
            req.query?.preview ===
              '1'
          ) {
            if (
              !adminAuthorized(req)
            ) {
              return res
                .status(401)
                .json({
                  ok: false,
                  error:
                    'Unauthorized'
                });
            }

            try {
              const state =
                await latestState();

              const month =
                validMonth(
                  req.query?.month,
                  now.month
                );

              const custom =
                state
                  ?.monthlyLineSettings
                  ?.messages
                  ?.[String(month)];

              return res
                .status(200)
                .json({
                  ok: true,
                  month,
                  message:
                    resolveMessage(
                      state,
                      month
                    ),
                  custom:
                    typeof custom ===
                      'string' &&
                    !!custom.trim(),
                  enabled:
                    state
                      .monthlyLineSettings
                      ?.enabled !== false,
                  target: {
                    gender: '女性',
                    age: '15〜29歳',
                    friendship:
                      '365日未満'
                  },
                  lastStatus:
                    state
                      .monthlyLineStatus ||
                    null
                });
            } catch (e) {
              return res
                .status(500)
                .json({
                  ok: false,
                  error:
                    e.message
                });
            }
          }

          if (
            req.method === 'POST'
          ) {
            if (
              !adminAuthorized(req)
            ) {
              return res
                .status(401)
                .json({
                  ok: false,
                  error:
                    'Unauthorized'
                });
            }

            if (
              req.body?.action !==
              'test'
            ) {
              return res
                .status(400)
                .json({
                  ok: false,
                  error:
                    'Invalid action'
                });
            }

            try {
              const state =
                await latestState();

              const month =
                validMonth(
                  req.body?.month,
                  now.month
                );

              const entered =
                typeof req.body?.message ===
                  'string'
                  ? req.body.message.trim()
                  : '';

              if (
                entered.length > 5000
              ) {
                return res
                  .status(400)
                  .json({
                    ok: false,
                    error:
                      'Message is too long'
                  });
              }

              const message =
                entered ||
                resolveMessage(
                  state,
                  month
                );

              await pushToOwner(
                state,
                message
              );

              return res
                .status(200)
                .json({
                  ok: true,
                  month
                });
            } catch (e) {
              return res
                .status(500)
                .json({
                  ok: false,
                  error:
                    e.message
                });
            }
          }

          '''

          text = text[:start] + new_handler + text[end:]
          needle = "  const r =\n    await fetch(\n      'https://api.line.me/v2/bot/message/narrowcast',\n"

          replacement = """  const message =
            resolveMessage(
              state,
              now.month
            );

          const r =
            await fetch(
              'https://api.line.me/v2/bot/message/narrowcast',
          """

          if needle not in text:
              raise SystemExit(
                  "narrowcast 部分が見つかりません"
              )

          text = text.replace(
              needle,
              replacement,
              1
          )

          path.write_text(text)

          print("月初LINE編集機能 OK")
          PY

      - name: Check JavaScript
        shell: bash
        run: |
          node --check owner-upgrade.js
          node --check api/monthly-line.js

          grep -q "こんにちは！" api/monthly-line.js
          grep -q "季節テンプレに戻す" owner-upgrade.js
          grep -q "monthlyLineMonth" owner-upgrade.js
          grep -q "resolveMessage" api/monthly-line.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "Salon Manager Upgrade"
          git config user.email "actions@users.noreply.github.com"

          git add \
            owner-upgrade.js \
            api/monthly-line.js

          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi

          git commit -m "Add editable monthly LINE messages"
          git push
