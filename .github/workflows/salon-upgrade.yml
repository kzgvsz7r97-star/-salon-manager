name: 見込み売上 モデル除外修正

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exclude model bookings from sales forecast
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()

          old_sales = "const bookingSales=b.filter(x=>x.paymentComplete).reduce((a,x)=>a+Number(x.price||0),0);"
          new_sales = "const bookingSales=normal.filter(x=>x.paymentComplete).reduce((a,x)=>a+Number(x.price||0),0);"

          old_forecast = "const bookingForecast=b.reduce((a,x)=>a+Number(x.price||0),0);"
          new_forecast = "const bookingForecast=normal.reduce((a,x)=>a+Number(x.price||0),0);"

          if old_sales in text:
              text = text.replace(old_sales, new_sales, 1)
          elif new_sales not in text:
              raise SystemExit("bookingSales target not found")

          if old_forecast in text:
              text = text.replace(old_forecast, new_forecast, 1)
          elif new_forecast not in text:
              raise SystemExit("bookingForecast target not found")

          text = text.replace(
              "// 売上は決済完了した予約のみ。未決済は見込みに残す",
              "// 売上・見込みは通常客のみ。モデルは人数だけ別集計",
              1
          )

          path.write_text(text)
          PY

          grep -q "const bookingSales=normal.filter" index.html
          grep -q "const bookingForecast=normal.reduce" index.html

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Exclude model bookings from sales forecast"
          git push
