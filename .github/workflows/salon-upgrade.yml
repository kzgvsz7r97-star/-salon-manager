name: 予約一覧 今月表示に統一

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Default reservation list to current month
        shell: bash
        run: |
          cat > booking-current-month.js <<'JS'
          (() => {
            if (window.__bookingCurrentMonthV1) return;
            window.__bookingCurrentMonthV1 = true;

            function monthRange() {
              const now = new Date();
              const start = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-01`;
              const end = localISO(new Date(now.getFullYear(), now.getMonth() + 1, 0));
              return { start, end };
            }

            function setCurrentMonthIfBlank() {
              const from = document.getElementById('bookingFilterFrom');
              const to = document.getElementById('bookingFilterTo');
              if (!from || !to) return;
              if (!from.value && !to.value) {
                const range = monthRange();
                from.value = range.start;
                to.value = range.end;
              }
            }

            const originalRenderBookings = renderBookings;
            renderBookings = function () {
              setCurrentMonthIfBlank();
              return originalRenderBookings();
            };

            resetBookingFilters = function () {
              if ($('bookingFilterName')) $('bookingFilterName').value = '';

              const range = monthRange();
              if ($('bookingFilterFrom')) $('bookingFilterFrom').value = range.start;
              if ($('bookingFilterTo')) $('bookingFilterTo').value = range.end;

              [
                'bookingFilterSource',
                'bookingFilterType',
                'bookingFilterBookingType',
                'bookingFilterStaff',
                'bookingFilterStatus',
                'bookingFilterPayment',
                'bookingFilterNext'
              ].forEach(id => {
                if ($(id)) $(id).value = '';
              });

              renderBookings();
            };

            setCurrentMonthIfBlank();
            renderBookings();
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text()

          tag = '<script src="booking-current-month.js?v=20261008b"></script>'
          text = re.sub(r'\n?<script src="booking-current-month\.js[^>]*></script>', '', text)
          text = text.replace('</body>', tag + '\n</body>')

          path.write_text(text)
          PY

          node --check booking-current-month.js
          grep -q "booking-current-month.js?v=20261008b" index.html
          grep -q "setCurrentMonthIfBlank" booking-current-month.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add booking-current-month.js index.html

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Default reservation list to current month"
          git push
