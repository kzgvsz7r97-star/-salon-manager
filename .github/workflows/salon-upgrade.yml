name: 再来連絡 成果追跡

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add followup outcome tracking
        shell: bash
        run: |
          echo '' | base64 -d > followup-outcomes.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text()
          tag='<script src="followup-outcomes.js?v=20261008b"></script>'
          s=re.sub(r'\n?<script src="followup-outcomes\.js[^>]*></script>','',s)
          anchor='<script src="return-manager.js?v=20261007a"></script>'
          if anchor not in s:
              raise SystemExit("return-manager anchor not found")
          s=s.replace(anchor,anchor+'\n'+tag,1)
          p.write_text(s)
          PY
          node --check followup-outcomes.js
          grep -q "followup-outcomes.js?v=20261008b" index.html

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add followup-outcomes.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Track followup outcomes"
          git push
