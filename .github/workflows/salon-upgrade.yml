              '明るさを落としても透明感を残したカラーや、秋服に合うレイヤーもおすすめです◎'
            ],
            10: [
              '10月は乾燥が少しずつ出てきて、夏のダメージや毛先のパサつきが気になりやすい時期です。',
              '重く見えやすい秋冬の服にも、顔まわりやレイヤーを整えるとバランスが取りやすくなります◎'
            ],
            11: [
