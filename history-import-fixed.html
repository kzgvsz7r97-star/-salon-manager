<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salon Manager 過去予約取込 修正版</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}
#overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.card{width:min(430px,100%);background:white;border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
h1{font-size:22px;margin:0 0 10px}
p{font-size:14px;line-height:1.65;color:#555}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;background:#111;color:white}
button:disabled{opacity:.45}
.small{margin-top:10px;font-size:12px;color:#777}
#status{margin-top:12px;font-size:13px;font-weight:700;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="app" src="./index.html"></iframe>
<div id="overlay">
  <div class="card">
    <h1>過去予約をまとめて取込</h1>
    <p>前回の28枚入りデータをそのまま使い、ファイル選択を経由せずSalon Managerへ直接渡します。</p>
    <button id="start" disabled>準備中…</button>
    <div id="status">28枚の予約表データを読み込んでいます…</div>
    <div class="small">解析後は予約名を確認して「確認して一括統合」を押してください。</div>
  </div>
</div>

<script>
let SHOTS=[];
let frameReady=false;
const frame=document.getElementById('app');
const overlay=document.getElementById('overlay');
const status=document.getElementById('status');
const start=document.getElementById('start');

function dataURLToFile(dataURL,filename){
  const parts=dataURL.split(',');
  const bin=atob(parts[1]);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new File([bytes],filename,{type:'image/jpeg'});
}

function readyCheck(){
  if(SHOTS.length && frameReady){
    start.disabled=false;
    start.textContent='過去予約を読み込む';
    status.textContent='準備OK。28枚を直接解析できます。';
  }
}

async function loadShots(){
  try{
    const res=await fetch('./history-import.html?v='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('元データを取得できませんでした');
    const text=await res.text();
    const marker='const SHOTS=';
    const a=text.indexOf(marker);
    const b=text.indexOf(';\n\nfunction dataURLToFile',a);
    if(a<0||b<0)throw new Error('28枚の埋め込みデータが見つかりません');
    SHOTS=JSON.parse(text.slice(a+marker.length,b));
    if(!Array.isArray(SHOTS)||!SHOTS.length)throw new Error('予約表データが空です');
    readyCheck();
  }catch(err){
    console.error(err);
    status.textContent='エラー：'+(err.message||err);
    start.textContent='準備失敗';
  }
}

frame.addEventListener('load',()=>{
  frameReady=true;
  readyCheck();
});

start.addEventListener('click',async()=>{
  start.disabled=true;
  start.textContent='解析中…';

  try{
    const win=frame.contentWindow;
    if(
      typeof win.openImport!=='function' ||
      typeof win.handleImportFiles!=='function' ||
      typeof win.parseWeekStart!=='function'
    ){
      throw new Error('Salon Manager側の一括取込機能が見つかりません');
    }

    const originalParseWeekStart=win.parseWeekStart;
    let weekIndex=0;

    win.parseWeekStart=function(text){
      if(weekIndex<SHOTS.length){
        const iso=SHOTS[weekIndex++].weekStart;
        const [y,m,d]=iso.split('-').map(Number);
        return new Date(y,m-1,d,12,0,0,0);
      }
      return originalParseWeekStart(text);
    };

    win.openImport();
    await new Promise(r=>setTimeout(r,120));

    if(!win.Tesseract){
      throw new Error('文字読み取り機能の読み込みに失敗しました。ページを再読み込みしてください');
    }

    const files=SHOTS.map(shot=>dataURLToFile(shot.imageData,shot.filename));
    status.textContent=files.length+'枚をSalon Managerへ直接渡しました。\n解析が終わるまでこのまま待ってください。';

    await win.handleImportFiles({target:{files}});

    status.textContent='解析完了。Salon Manager側で予約名を確認してください。';
    start.textContent='解析完了';
    setTimeout(()=>{overlay.style.display='none';},1000);
  }catch(err){
    console.error(err);
    status.textContent='エラー：'+(err.message||err);
    start.disabled=false;
    start.textContent='もう一度試す';
  }
});

loadShots();
</script>
</body>
</html>
